name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME=${JAVA_HOME}"

          if [ -z "${JAVA_HOME}" ]; then
            echo "Error: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VERSION_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VERSION_STR}"

          if [ -z "${JAVA_VERSION_STR}" ]; then
            echo "Error: Unable to detect Java version." >&2
            exit 1
          fi

          JAVA_MAJOR=$(echo "${JAVA_VERSION_STR}" | awk -F '.' '{print ($1 == "1" ? $2 : $1)}')
          echo "Detected Java major version: ${JAVA_MAJOR}"

          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse Java major version as integer: ${JAVA_MAJOR}" >&2
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Active Java major version ${JAVA_MAJOR} is lower than 17." >&2
            exit 1
          fi

          echo "Java environment verified successfully: Java major version is ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore was not found after generation attempt." >&2
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "Error: Expected debug APK not found at ${EXPECTED_APK}" >&2
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "Error: ${EXPECTED_APK} is an empty file." >&2
            exit 1
          fi

          case "${EXPECTED_APK}" in
            *.apk) ;;
            *)
              echo "Error: ${EXPECTED_APK} does not have the .apk extension." >&2
              exit 1
              ;;
          esac

          if [ "${EXPECTED_APK}" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk" >&2
            exit 1
          fi

          echo "Debug APK successfully verified at ${EXPECTED_APK}."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        run: |
          RELEASE_TEMP_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "${RELEASE_TEMP_DIR}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${RELEASE_TEMP_DIR}/app-debug.apk"

          if [ ! -s "${RELEASE_TEMP_DIR}/app-debug.apk" ]; then
            echo "Error: Failed to copy verified APK to temporary release directory." >&2
            exit 1
          fi

          echo "RELEASE_TEMP_DIR=${RELEASE_TEMP_DIR}" >> "$GITHUB_ENV"
          echo "Verified APK prepared in temporary directory: ${RELEASE_TEMP_DIR}/app-debug.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('SplinterMesh Debug APK (v1.0.{0})', github.run_number) }}
          body: |
            Automated debug APK build from commit ${{ github.sha }}.
            Download the attached `app-debug.apk` directly to install on an Android device.
          draft: false
          prerelease: false
          files: ${{ env.RELEASE_TEMP_DIR }}/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
